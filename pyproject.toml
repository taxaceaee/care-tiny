[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "care-tiny"
version = "1.0.0"
description = "CARE-Tiny: a 10M-parameter detector for tiny objects in aerial images (33.7 AP on AI-TOD-v2)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "timm>=1.0.9",
    "pycocotools>=2.0.7",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "pillow>=10.0",
]
keywords = ["object detection", "tiny object detection", "aerial images", "AI-TOD", "pytorch"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/taxaceaee/care-tiny"

[tool.setuptools]
packages = ["care_tiny"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905"]  # zip() without strict=: the zipped sequences have equal length by construction

[tool.ruff.lint.isort]
known-first-party = ["care_tiny"]
known-local-folder = ["conftest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
